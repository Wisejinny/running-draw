<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>러너 미리보기</title>
<style>body{margin:0;background:#f4e3cc;font-family:sans-serif}canvas{display:block;width:100vw;height:100vh}
#ctl{position:fixed;left:10px;top:10px;background:#fff;padding:8px 12px;border-radius:10px}</style></head>
<body><canvas id="c"></canvas>
<div id="ctl">강도 <input id="k" type="range" min="0" max="1" step="0.05" value="1"> 속도 <input id="sp" type="range" min="0" max="2" step="0.05" value="1"></div>
<script src="runner.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const looks=[];for(let i=0;i<16;i++)looks.push(Runner.makeLook(rng(i*977+3)));
let ph=0,last=performance.now(),T=0;
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
 const k=+document.getElementById('k').value,sp=+document.getElementById('sp').value;
 ph+=dt*2*Math.PI*2.8*sp;
 const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 const cols=8,cw=innerWidth/cols,s=Math.min(cw/70,innerHeight/2/120);
 looks.forEach((L,i)=>{const x=(i%cols+0.5)*cw,y=(Math.floor(i/cols)+0.85)*innerHeight/2;
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(x,y,18*s,4*s,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.scale(s*L.h,s*L.h);Runner.draw(ctx,L,ph+i*0.7,{k,t:T});ctx.restore();});
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></body></html>
